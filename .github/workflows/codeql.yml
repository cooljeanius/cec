---
# cec/.github/wokflows/codeql.yml: GitHub Actions codeql workflow for cec
# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches:
      - master
      - dependabot/*
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - master
      - dependabot/*
  schedule:
    - cron: '45 16 * * 5'

jobs:
  analyze:
    name: Analyze
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners
    # Consider using larger runners for possible analysis time improvements.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['actions', 'c-cpp']
        # CodeQL supports the following languages:
        # 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin',
        # 'javascript-typescript', 'python', 'ruby', 'swift'
        # Use 'java-kotlin' to analyze code written in Java, Kotlin, or both
        # Use 'javascript-typescript' to analyze code written in JavaScript,
        # TypeScript, or both
        # Learn more about CodeQL language support at:
        # https://aka.ms/codeql-docs/language-support

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here or in a
          # config file.
          # By default, queries listed here will override any specified in a
          # config file.
          # Prefix the list here with "+" to use these queries and those in the
          # config file.

          # For more details on CodeQL's query packs, refer to:
          # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

      - name: Dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -y install antlr libantlr-java expat ghostscript noweb

      - name: Adjust timestamps
        run: |
          cd src
          if test -s EsterelParser.cpp && test EsterelParser.cpp -ot esterel.g; then \
            touch EsterelParser.cpp; \
          fi
          if test -s AST.cpp && test AST.cpp -ot AST.sh; then \
            touch AST.cpp; \
          fi
          if test -s AST.hpp && test AST.hpp -ot AST.sh; then \
            touch AST.hpp; \
          fi

      # Autobuild attempts to build any compiled languages
      # (C/C++, C#, Go, Java, or Swift).
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.8
        env:
          ANTLR_HOME: /usr/share/java
          CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: false
          MAKEFLAGS: -w
          CXXFLAGS: -fpermissive

      - name: Debug failure
        if: failure()
        run: |
          if test -x "$(which locate)"; then \
            locate antlr; \
          elif test -x "$(which glocate)"; then \
            glocate antlr;
          elif test -x "$(which mlocate)"; then \
            mlocate antlr; \
          elif test -x "$(which plocate)"; then \
            plocate antlr; \
          elif test -x "$(which mdfind)"; then \
            mdfind antlr; \
          elif test -x "$(which find)"; then \
            which -a find; \
            if test -w config.log; then \
              find / -name antlr -perm +r -user "$(whoami)" 2>>config.log; \
              if test -r . && test -r config.log; then \
                find . -name config.log -print0 | xargs -0 cat | grep -i error | sort | uniq; \
              fi; \
            elif test -w autoscan.log; then \
              find / -name antlr -perm +r -user "$(whoami)" 2>>autoscan.log; \
              if test -r . && test -r autoscan.log; then \
                find . -name autoscan.log -print0 | xargs -0 cat | grep -i error | sort | uniq; \
              fi; \
            else \
              find / -name antlr -perm +r -user "$(whoami)" 2>&1; \
            fi; \
          else \
            echo "unable to find antlr!" >&2; \
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:${{matrix.language}}"
